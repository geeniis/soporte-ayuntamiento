services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ayuntamiento
    ports:
      - "5434:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgres://usuario:password@db:5432/ayuntamiento
      NODE_ENV: production
      JWT_SECRET: change_me_prod
    depends_on:
      - db
    ports:
      - "3001:3000"
